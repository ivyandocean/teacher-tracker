<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Teacher Tracker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
--bg:#f9eae1;--bg2:#fff8f4;--bg3:#f0e0d6;--bg4:#e8d0c6;
--text:#2a1a1a;--text2:#5c3d3d;--text3:#9a7070;
--border:#e0c8be;--border2:#cdb0a6;
--blue:#7d4f50;--blue2:#6a3f40;--blue-bg:#f3e0e0;
--green:#4a8a78;--green-bg:#ddf0eb;
--red:#b84040;--red-bg:#fce8e8;
--amber:#a06828;--amber-bg:#faeedd;
--purple:#7a5a90;--purple-bg:#ede0f3;
--teal:#6ba292;--teal-bg:#ddf0eb;
--coral:#cc8b86;--coral-bg:#faeae8;
--radius:12px;--radius-sm:8px;--nav-h:64px;
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:15px;min-height:100vh;overflow-x:hidden}
#app{display:flex;flex-direction:column;min-height:100vh;max-width:600px;margin:0 auto}
#content{flex:1;overflow-y:auto;padding:0 0 calc(var(--nav-h)+8px)}
#nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:600px;height:var(--nav-h);background:var(--bg2);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-around;z-index:100;padding:0 4px}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 12px;border-radius:var(--radius-sm);border:none;background:none;color:var(--text3);cursor:pointer;transition:all .15s;flex:1;min-width:0}
.nav-btn.active{color:var(--blue)}
.nav-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.nav-btn span{font-size:10px;font-weight:500;white-space:nowrap}
.page-header{padding:16px 16px 8px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--bg);z-index:10;border-bottom:1px solid var(--border)}
.page-title{font-size:20px;font-weight:600}
.btn-icon{width:36px;height:36px;border-radius:var(--radius-sm);background:var(--bg3);border:1px solid var(--border);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.btn-icon svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tile-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}
.tile{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;cursor:pointer;transition:all .15s;display:flex;flex-direction:column;gap:8px;min-height:90px}
.tile:active{transform:scale(0.97);background:var(--bg3)}
.tile-icon{width:36px;height:36px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center}
.tile-icon svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tile-label{font-size:13px;font-weight:600}.tile-sub{font-size:11px;color:var(--text3)}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);margin:0 16px 12px}
.form-group{margin-bottom:14px}
.form-label{font-size:12px;font-weight:500;color:var(--text2);margin-bottom:6px;display:block}
.form-input{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:10px 12px;color:var(--text);font-size:14px;outline:none}
.form-input:focus{border-color:var(--blue)}
.btn{padding:10px 18px;border-radius:var(--radius-sm);font-size:14px;font-weight:500;cursor:pointer;border:none;transition:all .15s}
.btn-primary{background:var(--blue);color:#fff}.btn-primary:active{background:var(--blue2)}
.btn-secondary{background:var(--bg3);color:var(--text);border:1px solid var(--border2)}
.btn-danger{background:var(--red-bg);color:var(--red);border:1px solid var(--red)}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-row{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--border);flex-wrap:wrap}
.student-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer}
.student-row:last-child{border-bottom:none}
.student-row:active{background:var(--bg3)}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--bg4);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;color:var(--text2);overflow:hidden;flex-shrink:0}
.avatar img{width:100%;height:100%;object-fit:cover}
.student-info{flex:1;min-width:0}.student-name{font-size:14px;font-weight:500}.student-meta{font-size:12px;color:var(--text3)}
.chevron svg{width:16px;height:16px;stroke:var(--text3);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.color-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.group-badge{padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600}
.col-blue{background:var(--blue-bg);color:var(--blue)}.col-green{background:var(--green-bg);color:var(--green)}
.col-purple{background:var(--purple-bg);color:var(--purple)}.col-coral{background:var(--coral-bg);color:var(--coral)}
.col-amber{background:var(--amber-bg);color:var(--amber)}.col-teal{background:var(--teal-bg);color:var(--teal)}
.color-options{display:flex;gap:8px;flex-wrap:wrap}
.color-opt{width:32px;height:32px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .15s}
.color-opt.selected{border-color:#fff;transform:scale(1.1)}
.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg2);border-radius:20px 20px 0 0;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;padding-bottom:32px}
.sheet-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:12px auto 0}
.sheet-header{padding:16px 20px;font-size:17px;font-weight:600;border-bottom:1px solid var(--border)}
.sheet-body{padding:16px 20px}
.photo-upload{width:80px;height:80px;border-radius:50%;background:var(--bg3);border:2px dashed var(--border2);display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;flex-shrink:0}
.photo-upload img{width:100%;height:100%;object-fit:cover}
.photo-upload svg{width:28px;height:28px;stroke:var(--text3);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 24px;gap:12px;text-align:center}
.empty svg{width:48px;height:48px;stroke:var(--text3);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.empty-title{font-size:16px;font-weight:600;color:var(--text2)}.empty-sub{font-size:13px;color:var(--text3)}
.section-label{font-size:11px;font-weight:600;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;padding:16px 16px 8px;display:flex;align-items:center;justify-content:space-between}
.tag{padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.group-tabs{display:flex;gap:8px;padding:12px 16px;overflow-x:auto}
.group-tab{padding:6px 14px;border-radius:20px;font-size:13px;font-weight:500;cursor:pointer;border:1px solid var(--border2);background:var(--bg2);color:var(--text2);white-space:nowrap;transition:all .15s}
.group-tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.date-bar{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:var(--bg2);border-bottom:1px solid var(--border)}
.date-nav{display:flex;align-items:center;gap:4px}
.date-nav button{width:32px;height:32px;border-radius:var(--radius-sm);background:var(--bg3);border:1px solid var(--border);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center}
.date-nav button svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.date-nav input[type=date]{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:4px 8px;color:var(--text);font-size:13px;outline:none}
.att-btns{display:flex;gap:6px}
.att-btn{padding:5px 10px;border-radius:var(--radius-sm);font-size:12px;font-weight:600;cursor:pointer;border:1px solid transparent;transition:all .15s;white-space:nowrap}
.att-present{background:var(--green-bg);color:var(--green)}.att-present.sel{border-color:var(--green);box-shadow:0 0 0 1px var(--green)}
.att-absent{background:var(--red-bg);color:var(--red)}.att-absent.sel{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}
.att-late{background:var(--amber-bg);color:var(--amber)}.att-late.sel{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber)}
.att-early{background:var(--purple-bg);color:var(--purple)}.att-early.sel{border-color:var(--purple);box-shadow:0 0 0 1px var(--purple)}
.face-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:12px;padding:16px}
.face-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:8px}
.face-name{font-size:11px;font-weight:500;text-align:center;color:var(--text2);line-height:1.3;word-break:break-word}
.face-avatar{width:56px;height:56px;border-radius:50%;background:var(--bg4);border:2px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;color:var(--text2);overflow:hidden;flex-shrink:0;cursor:pointer}
.face-avatar img{width:100%;height:100%;object-fit:cover}
.part-btns{display:flex;gap:6px}
.part-btn{width:34px;height:34px;border-radius:var(--radius-sm);font-size:16px;cursor:pointer;border:1px solid var(--border2);background:var(--bg3);display:flex;align-items:center;justify-content:center;transition:all .15s;font-weight:700}
.part-btn:active{transform:scale(0.9)}
.part-check.active{background:var(--green-bg);border-color:var(--green);color:var(--green)}
.part-x.active{background:var(--red-bg);border-color:var(--red);color:var(--red)}
.part-tally{font-size:10px;color:var(--text3);text-align:center}
.beh-tag{padding:8px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--border2);background:var(--bg3);transition:all .15s;text-align:center}
.beh-tag:active{transform:scale(0.95)}
.beh-pos{background:var(--green-bg);color:var(--green);border-color:var(--green-bg)}
.beh-neg{background:var(--red-bg);color:var(--red);border-color:var(--red-bg)}
.beh-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:4px 0}
.beh-log-item{padding:10px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.beh-log-item:last-child{border-bottom:none}
.beh-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.todo-item{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border)}
.todo-item:last-child{border-bottom:none}
.todo-check{width:22px;height:22px;border-radius:6px;border:2px solid var(--border2);background:var(--bg3);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;transition:all .15s}
.todo-check.done{background:var(--blue);border-color:var(--blue)}
.todo-check svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.todo-body{flex:1;min-width:0}.todo-title{font-size:14px;font-weight:500}.todo-title.done{text-decoration:line-through;color:var(--text3)}
.todo-meta{font-size:12px;color:var(--text3);margin-top:2px}
.todo-del{width:28px;height:28px;border-radius:var(--radius-sm);background:none;border:none;color:var(--text3);cursor:pointer;display:flex;align-items:center;justify-content:center}
.todo-del svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sub-tabs{display:flex;border-bottom:1px solid var(--border);padding:0 8px}
.sub-tab{flex:1;padding:10px 4px;background:none;border:none;border-bottom:2px solid transparent;color:var(--text3);cursor:pointer;font-size:12px;font-weight:500;transition:all .15s}
.sub-tab.active{color:var(--blue);border-bottom-color:var(--blue)}
.grade-table{width:100%;border-collapse:collapse;font-size:12px}
.grade-table th{padding:8px 10px;text-align:left;color:var(--text3);font-weight:600;border-bottom:1px solid var(--border);white-space:nowrap}
.grade-table td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
.grade-table tr:last-child td{border-bottom:none}
.level-badge{padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;display:inline-block}
.level-1{background:#fce8e8;color:#b84040}.level-2{background:#faeedd;color:#a06828}
.level-3{background:#ddf0eb;color:#4a8a78}.level-4{background:#ddf0eb;color:#2d6e5a}
.level-5{background:#f3e0e0;color:#7d4f50}.level-5p{background:#ede0f3;color:#7a5a90}
.check-row{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--border)}
.check-row:last-child{border-bottom:none}
.sub-toggle{width:28px;height:28px;border-radius:6px;border:2px solid var(--border2);background:var(--bg3);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.sub-toggle.submitted{background:var(--green-bg);border-color:var(--green)}
.sub-toggle svg{width:14px;height:14px;stroke:var(--text3);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.sub-toggle.submitted svg{stroke:var(--green)}
.contact-item{padding:12px 16px;border-bottom:1px solid var(--border)}
.contact-item:last-child{border-bottom:none}
.bar-wrap{padding:0 16px 16px}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.bar-label{font-size:12px;color:var(--text2);width:100px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{flex:1;height:18px;background:var(--bg3);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px}
.bar-val{font-size:12px;color:var(--text3);width:48px;text-align:right;flex-shrink:0}
</style>
</head>
<body>
<div id="app"><div id="content"></div>
<nav id="nav">
  <button class="nav-btn active" onclick="showSection('today')" id="nav-today"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span>Today</span></button>
  <button class="nav-btn" onclick="showSection('daily')" id="nav-daily"><svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg><span>Daily</span></button>
  <button class="nav-btn" onclick="showSection('records')" id="nav-records"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg><span>Records</span></button>
  <button class="nav-btn" onclick="showSection('students')" id="nav-students"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg><span>Students</span></button>
  <button class="nav-btn" onclick="showSection('planning')" id="nav-planning"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><span>Planning</span></button>
  <button class="nav-btn" onclick="showSection('classes')" id="nav-classes"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg><span>Setup</span></button>
</nav></div>
<script>
const S={
  section:'today',
  groups:JSON.parse(localStorage.getItem('tt_groups')||'[]'),
  students:JSON.parse(localStorage.getItem('tt_students')||'[]'),
  attendance:JSON.parse(localStorage.getItem('tt_attendance')||'{}'),
  participation:JSON.parse(localStorage.getItem('tt_participation')||'{}'),
  behavior:JSON.parse(localStorage.getItem('tt_behavior')||'[]'),
  behaviorTags:JSON.parse(localStorage.getItem('tt_btags')||'null')||[
    {id:'bt1',label:'On Task',type:'pos'},{id:'bt2',label:'Great Effort',type:'pos'},{id:'bt3',label:'Helpful',type:'pos'},{id:'bt4',label:'Positive Attitude',type:'pos'},{id:'bt5',label:'Strong Participation',type:'pos'},
    {id:'bt6',label:'Off Task',type:'neg'},{id:'bt7',label:'Disruptive',type:'neg'},{id:'bt8',label:'Called Out',type:'neg'},{id:'bt9',label:'Needs Redirect',type:'neg'},{id:'bt10',label:'Unprepared',type:'neg'},
  ],
  todos:JSON.parse(localStorage.getItem('tt_todos')||'[]'),
  grades:JSON.parse(localStorage.getItem('tt_grades')||'{}'),
  gassign:JSON.parse(localStorage.getItem('tt_gassign')||'[]'),
  rubric:JSON.parse(localStorage.getItem('tt_rubric')||'null')||{1:0,2:55,3:70,4:80,5:90,6:100},
  terms:JSON.parse(localStorage.getItem('tt_terms')||'null')||[{id:'t1',label:'Term 1',start:'',end:''},{id:'t2',label:'Term 2',start:'',end:''},{id:'t3',label:'Term 3',start:'',end:''}],
  checklist:JSON.parse(localStorage.getItem('tt_checklist')||'{}'),
  assignments:JSON.parse(localStorage.getItem('tt_assignments')||'[]'),
  contacts:JSON.parse(localStorage.getItem('tt_contacts')||'[]'),
  schedule:JSON.parse(localStorage.getItem('tt_schedule')||'{}'),
  schedBlocks:JSON.parse(localStorage.getItem('tt_schedblocks')||'null')||['8:00','8:50','9:40','10:30','11:20','12:10','13:00','13:50','14:40','15:30'],
  journal:JSON.parse(localStorage.getItem('tt_journal')||'{}'),
  iepStrategies:JSON.parse(localStorage.getItem('tt_iepstrats')||'{}'),
  schedImages:JSON.parse(localStorage.getItem('tt_schedimgs')||'[]'),
  studentNotes:JSON.parse(localStorage.getItem('tt_snotes')||'{}'),
  subNotes:JSON.parse(localStorage.getItem('tt_subnotes')||'null')||null,
  iepStudent:null,
  sheet:null,editGroup:null,editStudent:null,
  dailyTab:'attendance',recordsTab:'grades',planTab:'schedule',
  activeGroup:null,attDate:todayStr(),partDate:todayStr(),
  behStudent:null,showDoneTodos:false,
  gradesGroup:null,gradesTerm:'t1',gradesSubject:'ela',
  currentAssign:null,schedDay:'Monday',journalGroup:null,journalDate:todayStr(),
  checkGroup:null,reportGroup:null,reportType:'behaviour',contactStudent:null,
};
const COLORS=[{id:'blue',label:'Smoky Rose',dot:'#7d4f50',cls:'col-blue'},{id:'green',label:'Muted Teal',dot:'#6ba292',cls:'col-green'},{id:'purple',label:'Purple',dot:'#7a5a90',cls:'col-purple'},{id:'coral',label:'Dusty Rose',dot:'#cc8b86',cls:'col-coral'},{id:'amber',label:'Amber',dot:'#a06828',cls:'col-amber'},{id:'teal',label:'Teal',dot:'#4a8a78',cls:'col-teal'}];
const SUBJECTS=[
  {id:'ela',label:'ELA',comps:[{id:'oral',label:'ELA Oral',w:33.3},{id:'comp',label:'ELA Comprehension',w:33.3},{id:'prod',label:'ELA Produces',w:33.4}]},
  {id:'math',label:'Math',comps:[{id:'sit',label:'Situational Problems',w:30},{id:'reas',label:'Reasoning',w:70}]},
  {id:'ccq',label:'CCQ',comps:[{id:'ccq1',label:'Culture & Citizenship in Quebec',w:100}]},
];
function todayStr(){const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function fmtDate(s){if(!s)return'';const[y,m,d]=s.split('-').map(Number);return`${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m-1]} ${d}, ${y}`}
function fmtTime(ts){return new Date(ts).toLocaleTimeString('en-CA',{hour:'2-digit',minute:'2-digit',hour12:true})}
function offsetDate(s,days){const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+days);return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function save(){
  const map={groups:'tt_groups',students:'tt_students',attendance:'tt_attendance',participation:'tt_participation',behavior:'tt_behavior',behaviorTags:'tt_btags',todos:'tt_todos',grades:'tt_grades',gassign:'tt_gassign',rubric:'tt_rubric',terms:'tt_terms',checklist:'tt_checklist',assignments:'tt_assignments',contacts:'tt_contacts',schedule:'tt_schedule',schedBlocks:'tt_schedblocks',journal:'tt_journal',iepStrategies:'tt_iepstrats',schedImages:'tt_schedimgs',studentNotes:'tt_snotes',subNotes:'tt_subnotes'};
  Object.entries(map).forEach(([k,v])=>localStorage.setItem(v,JSON.stringify(S[k])));
}
function getColor(id){return COLORS.find(c=>c.id===id)||COLORS[0]}
function initials(n){return n.split(' ').map(w=>w[0]||'').join('').toUpperCase().slice(0,2)||'?'}
function activeGroup(){if(S.activeGroup&&S.groups.find(g=>g.id===S.activeGroup))return S.activeGroup;return S.groups[0]?.id||null}
function sortStudents(arr,mode){if(mode==='last')return[...arr].sort((a,b)=>a.name.trim().split(' ').pop().toLowerCase().localeCompare(b.name.trim().split(' ').pop().toLowerCase()));return[...arr].sort((a,b)=>(parseInt(a.num)||999)-(parseInt(b.num)||999))}
function groupStudents(gid){const g=S.groups.find(x=>x.id===gid);return sortStudents(S.students.filter(s=>s.groupId===gid),g?.sortMode||'num')}
function nextStudentNum(gid){const nums=S.students.filter(s=>s.groupId===gid&&s.num).map(s=>parseInt(s.num)||0);return nums.length?Math.max(...nums)+1:1}
function formatDate(d){if(!d)return'';const[y,m,day]=d.split('-').map(Number);return`${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m-1]} ${day}, ${y}`}
function pctToLevel(p){const r=S.rubric;if(p>=r[6])return'5+';if(p>=r[5])return'5';if(p>=r[4])return'4';if(p>=r[3])return'3';if(p>=r[2])return'2';return'1'}
function levelBadge(l){return`<span class="level-badge level-${l==='5+'?'5p':l}">${l}</span>`}
function compAssigns(gid,tid,subj,comp){return S.gassign.filter(a=>a.groupId===gid&&a.termId===tid&&a.subj===subj&&a.comp===comp)}
function getScore(sid,aid){return S.grades[sid+'__'+aid]||null}
function compAvgDirect(sid,gid,tid,subj,comp){
  const as=compAssigns(gid,tid,subj,comp);
  const sc=as.map(a=>{const s=getScore(sid,a.id);return s?{scored:s.scored,possible:a.possible,modified:s.modified}:null}).filter(x=>x&&!x.modified);
  if(!sc.length)return null;
  return sc.reduce((t,x)=>t+(x.scored/x.possible*100),0)/sc.length;
}
function subjectAvg(sid,gid,tid,subj){
  const sub=SUBJECTS.find(s=>s.id===subj);let ws=0,wt=0;
  sub.comps.forEach(c=>{const a=compAvgDirect(sid,gid,tid,subj,c.id);if(a!==null){ws+=a*c.w;wt+=c.w}});
  return wt>0?ws/wt:null;
}
function colorDot(id){return{blue:'#7d4f50',green:'#6ba292',purple:'#7a5a90',coral:'#cc8b86',amber:'#a06828',teal:'#4a8a78',none:'#9a7070'}[id]||'#9a7070'}

  sub.comps.forEach(c=>{html+=`<th>${c.label.split(' ').slice(-1)[0]}<br><span style="font-size:10px;color:var(--text3)">${c.w}%</span></th>`});
  html+=`<th>Avg</th></tr></thead><tbody>`;
  students.forEach(s=>{
    html+=`<tr><td><div style="font-size:13px;font-weight:500">${s.name.split(' ')[0]}</div>${s.iep?`<span class="tag" style="background:var(--amber-bg);color:var(--amber);font-size:10px">IEP</span>`:''}</td>`;
    sub.comps.forEach(comp=>{
      const avg=compAvgDirect(s.id,gid,tid,subj,comp.id);
      const ac=compAssigns(gid,tid,subj,comp.id).length;
      html+=`<td onclick="openCompAssigns('${gid}','${tid}','${subj}','${comp.id}')" style="cursor:pointer">${avg!==null?`${levelBadge(pctToLevel(avg))}<br><span style="font-size:10px;color:var(--text3)">${avg.toFixed(0)}% (${ac})</span>`:`<span style="color:var(--blue);font-size:12px">+ Add</span>`}</td>`;
    });
    const sA=subjectAvg(s.id,gid,tid,subj);
    html+=`<td>${sA!==null?`${levelBadge(pctToLevel(sA))}<br><span style="font-size:10px;color:var(--text3)">${sA.toFixed(0)}%</span>`:'—'}</td></tr>`;
  });
  html+=`</tbody></table></div>`;
  sub.comps.forEach(comp=>{
    const as=compAssigns(gid,tid,subj,comp.id);
    html+=`<div class="section-label"><span>${comp.label}</span></div>`;
    if(!as.length){html+=`<div style="padding:4px 16px 12px;font-size:13px;color:var(--text3)">No assignments yet</div>`;}
    else{
      html+=`<div class="card" style="margin-bottom:8px">`;
      as.forEach(a=>{
        const scores=students.map(s=>getScore(s.id,a.id)).filter(x=>x&&!x.modified);
        const entered=students.filter(s=>getScore(s.id,a.id)).length;
        const avg=scores.length?scores.reduce((t,x)=>t+(x.scored/a.possible*100),0)/scores.length:null;
        html+=`<div class="student-row" onclick="S.currentAssign='${a.id}';S.section='grade-entry';render()">
          <div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:500">${a.name}</div><div style="font-size:12px;color:var(--text3)">${fmtDate(a.date)} · /${a.possible} · ${entered}/${students.length} entered</div></div>
          ${avg!==null?`<div style="margin-right:8px">${levelBadge(pctToLevel(avg))}</div>`:''}
          <div class="chevron"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></div>
        </div>`;
      });
      html+=`</div>`;
    }
  });
  body.innerHTML=html;
}

  });
}
function saveAllGrades(aid,possible){
  const a=S.gassign.find(x=>x.id===aid);if(!a)return;
  const students=groupStudents(a.groupId),edits=window._ge||{};
  students.forEach(s=>{
    if(edits[s.id]===undefined)return;
    const val=String(edits[s.id]).trim(),k=s.id+'__'+aid;
    if(val===''||val==='null'){delete S.grades[k];}
    else{const sc=parseFloat(val);if(!isNaN(sc))S.grades[k]={scored:sc,aid,modified:false};}
  });
  save();window._ge={};S.section='records';render();
}
function deleteAssign(id){
  if(!confirm('Delete this assignment and all its grades?'))return;
  S.gassign=S.gassign.filter(a=>a.id!==id);
  Object.keys(S.grades).forEach(k=>{if(k.endsWith('__'+id))delete S.grades[k]});
  save();window._ge={};S.section='records';render();
}

function renderReportsInPlace(){
  const body=document.getElementById('report-body');if(!body)return;
  const gid=S.reportGroup||activeGroup();S.reportGroup=gid;
  document.querySelectorAll('.group-tabs .group-tab').forEach(el=>{
    const fn=el.getAttribute('onclick')||'';
    el.classList.toggle('active',fn.includes("'"+gid+"'"));
  });
  const students=groupStudents(gid),t=S.reportType;
  if(t==='behaviour'){
    const tc={};S.behavior.filter(b=>b.gid===gid).forEach(b=>{tc[b.label]=(tc[b.label]||0)+1});
    const sc=students.map(s=>({name:s.name.split(' ')[0],count:S.behavior.filter(b=>b.sid===s.id&&b.gid===gid).length})).sort((a,b)=>b.count-a.count);
    const mx=Math.max(...sc.map(x=>x.count),1),ta=Object.entries(tc).sort((a,b)=>b[1]-a[1]),mt=Math.max(...ta.map(x=>x[1]),1);
    body.innerHTML=`<div class="section-label">By Student</div><div class="bar-wrap">${sc.map(x=>`<div class="bar-row"><div class="bar-label">${x.name}</div><div class="bar-track"><div class="bar-fill" style="width:${(x.count/mx*100).toFixed(0)}%;background:var(--amber)"></div></div><div class="bar-val">${x.count}</div></div>`).join('')}</div><div class="section-label">By Tag</div><div class="bar-wrap">${ta.map(([l,n])=>{const tag=S.behaviorTags.find(t=>t.label===l);return`<div class="bar-row"><div class="bar-label">${l}</div><div class="bar-track"><div class="bar-fill" style="width:${(n/mt*100).toFixed(0)}%;background:${tag?.type==='pos'?'var(--green)':'var(--red)'}"></div></div><div class="bar-val">${n}</div></div>`}).join('')}</div>`;
  } else if(t==='attendance'){
    const data=students.map(s=>{const ab=Object.entries(S.attendance).filter(([k])=>k.startsWith(gid+'__')).reduce((n,[,v])=>n+(v[s.id]==='absent'?1:0),0);const lt=Object.entries(S.attendance).filter(([k])=>k.startsWith(gid+'__')).reduce((n,[,v])=>n+(v[s.id]==='late'?1:0),0);return{name:s.name.split(' ')[0],ab,lt}}).sort((a,b)=>b.ab-a.ab);
    const mx=Math.max(...data.map(x=>x.ab),1);
    body.innerHTML=`<div class="section-label">Absences by Student</div><div class="bar-wrap">${data.map(x=>`<div class="bar-row"><div class="bar-label">${x.name}</div><div class="bar-track"><div class="bar-fill" style="width:${(x.ab/mx*100).toFixed(0)}%;background:var(--red)"></div></div><div class="bar-val">${x.ab}A ${x.lt}L</div></div>`).join('')}</div>`;
  } else if(t==='participation'){
    const data=students.map(s=>{let tc=0,tx=0;Object.entries(S.participation).filter(([k])=>k.startsWith(gid+'__')).forEach(([,v])=>{if(v[s.id]){tc+=v[s.id].c||0;tx+=v[s.id].x||0}});return{name:s.name.split(' ')[0],c:tc,x:tx}}).sort((a,b)=>b.c-a.c);
    const mx=Math.max(...data.map(x=>x.c+x.x),1);
    body.innerHTML=`<div class="section-label">Participation Tally</div><div class="bar-wrap">${data.map(x=>`<div class="bar-row"><div class="bar-label">${x.name}</div><div class="bar-track"><div class="bar-fill" style="width:${(x.c/mx*100).toFixed(0)}%;background:var(--green)"></div></div><div class="bar-val">${x.c}✓ ${x.x}✗</div></div>`).join('')}</div>`;
  } else if(t==='grades'){
    const tid=S.gradesTerm;
    body.innerHTML=`<div style="padding:8px 16px"><div class="sub-tabs">${S.terms.map(t=>`<button class="sub-tab${S.gradesTerm===t.id?' active':''}" onclick="S.gradesTerm='${t.id}';renderReportsInPlace()">${t.label}</button>`).join('')}</div></div>`+SUBJECTS.map(sub=>{const data=students.map(s=>{const avg=subjectAvg(s.id,gid,tid,sub.id);return{name:s.name.split(' ')[0],avg}}).filter(x=>x.avg!==null);if(!data.length)return`<div class="section-label">${sub.label} — no data</div>`;return`<div class="section-label">${sub.label}</div><div class="bar-wrap">${data.map(x=>`<div class="bar-row"><div class="bar-label">${x.name}</div><div class="bar-track"><div class="bar-fill" style="width:${x.avg.toFixed(0)}%;background:var(--blue)"></div></div><div class="bar-val">${levelBadge(pctToLevel(x.avg))}</div></div>`).join('')}</div>`;}).join('');
  }
}

function renderCalendar(body){
  const MONTHS=[
    {y:2025,m:7},{y:2025,m:8},{y:2025,m:9},{y:2025,m:10},{y:2025,m:11},
    {y:2026,m:0},{y:2026,m:1},{y:2026,m:2},{y:2026,m:3},{y:2026,m:4},{y:2026,m:5}
  ];
  const MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const today=new Date(),td=today.getDate(),tm=today.getMonth(),ty=today.getFullYear();

  // Cell dimensions — generous for Apple Pencil writing
  const CW=56,CH=72,DAY_HEADER=22,MONTH_HEADER=44,GAP=32,PAD=16;
  const CANVAS_W=CW*7+PAD*2;

  // Pre-calculate each month's Y offset on the single canvas
  const monthMeta=MONTHS.map(({y,m})=>{
    const first=new Date(y,m,1).getDay(); // 0=Sun
    const dim=new Date(y,m+1,0).getDate();
    const rows=Math.ceil((first+dim)/7);
    return{y,m,first,dim,rows,h:MONTH_HEADER+DAY_HEADER+rows*CH};
  });
  let cursor=PAD;
  monthMeta.forEach(mm=>{mm.offsetY=cursor;cursor+=mm.h+GAP;});
  const CANVAS_H=cursor+PAD;

  // Build single SVG
  let svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${CANVAS_W} ${CANVAS_H}" width="${CANVAS_W}" height="${CANVAS_H}" style="display:block">`;

  // Background
  svg+=`<rect width="${CANVAS_W}" height="${CANVAS_H}" fill="#f9eae1"/>`;

  const days=['S','M','T','W','T','F','S'];

  monthMeta.forEach(({y,m,first,dim,rows,h,offsetY})=>{
    const oy=offsetY;

    // Month card background
    svg+=`<rect x="${PAD/2}" y="${oy}" width="${CANVAS_W-PAD}" height="${h}" rx="10" fill="#fff8f4" stroke="#e0c8be" stroke-width="1"/>`;

    // Month title bar
    svg+=`<rect x="${PAD/2}" y="${oy}" width="${CANVAS_W-PAD}" height="${MONTH_HEADER}" rx="10" fill="#f0e0d6"/>`;
    svg+=`<rect x="${PAD/2}" y="${oy+MONTH_HEADER-6}" width="${CANVAS_W-PAD}" height="6" fill="#f0e0d6"/>`;
    svg+=`<text x="${CANVAS_W/2}" y="${oy+MONTH_HEADER/2+6}" text-anchor="middle" font-size="17" font-weight="700" fill="#2a1a1a" font-family="system-ui,sans-serif">${MN[m]} ${y}</text>`;

    // Day-of-week headers
    days.forEach((d,i)=>{
      const x=PAD+i*CW+CW/2;
      const isWknd=i===0||i===6;
      svg+=`<text x="${x}" y="${oy+MONTH_HEADER+DAY_HEADER-5}" text-anchor="middle" font-size="11" font-weight="600" fill="${isWknd?'#cc8b86':'#9a7070'}" font-family="system-ui,sans-serif">${d}</text>`;
    });

    // Divider under day headers
    svg+=`<line x1="${PAD}" y1="${oy+MONTH_HEADER+DAY_HEADER}" x2="${CANVAS_W-PAD}" y2="${oy+MONTH_HEADER+DAY_HEADER}" stroke="#e0c8be" stroke-width="0.75"/>`;

    // Vertical column dividers
    for(let i=1;i<7;i++){
      const x=PAD+i*CW;
      svg+=`<line x1="${x}" y1="${oy+MONTH_HEADER+DAY_HEADER}" x2="${x}" y2="${oy+h}" stroke="#1e2130" stroke-width="0.5"/>`;
    }

    // Day cells
    for(let row=0;row<rows;row++){
      for(let col=0;col<7;col++){
        const dayNum=row*7+col-first+1;
        if(dayNum<1||dayNum>dim)continue;
        const x=PAD+col*CW;
        const cy=oy+MONTH_HEADER+DAY_HEADER+row*CH;
        const isToday=dayNum===td&&m===tm&&y===ty;
        const isWknd=col===0||col===6;

        // Cell fill
        if(isToday){
          svg+=`<rect x="${x+1}" y="${cy+1}" width="${CW-2}" height="${CH-2}" fill="#1a2040"/>`;
          svg+=`<rect x="${x+1}" y="${cy+1}" width="${CW-2}" height="${CH-2}" fill="none" stroke="#4f7cff" stroke-width="1.5" rx="2"/>`;
        } else if(isWknd){
          svg+=`<rect x="${x+1}" y="${cy+1}" width="${CW-2}" height="${CH-2}" fill="#161820"/>`;
        }

        // Horizontal row dividers
        if(row>0){
          svg+=`<line x1="${PAD}" y1="${cy}" x2="${CANVAS_W-PAD}" y2="${cy}" stroke="#1e2130" stroke-width="0.5"/>`;
        }

        // Day number
        if(isToday){
          svg+=`<circle cx="${x+14}" cy="${cy+13}" r="10" fill="#4f7cff"/>`;
          svg+=`<text x="${x+14}" y="${cy+17}" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" font-family="system-ui,sans-serif">${dayNum}</text>`;
        } else {
          svg+=`<text x="${x+8}" y="${cy+16}" font-size="11" font-weight="500" fill="${isWknd?'#374151':'#4b5563'}" font-family="system-ui,sans-serif">${dayNum}</text>`;
        }

        // Writing lines — 4 faint ruled lines per cell for pencil
        for(let li=0;li<4;li++){
          const ly=cy+26+li*11;
          if(ly<cy+CH-4)svg+=`<line x1="${x+4}" y1="${ly}" x2="${x+CW-4}" y2="${ly}" stroke="#1c1f2e" stroke-width="0.6"/>`;
        }
      }
    }
  });

  // Today indicator label at very top
  svg+=`<text x="${CANVAS_W/2}" y="12" text-anchor="middle" font-size="9" fill="#cdb0a6" font-family="system-ui,sans-serif">Aug 2025 – Jun 2026  ·  Use Apple Pencil to annotate</text>`;

  svg+=`</svg>`;

  body.innerHTML=`
    <div style="display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--bg);border-bottom:1px solid var(--border);flex-shrink:0">
      <button class="btn btn-secondary btn-sm" onclick="calZoom(-0.25)" style="font-size:18px;line-height:1;padding:4px 14px">−</button>
      <div id="cal-zoom-label" style="font-size:12px;color:var(--text3);min-width:42px;text-align:center">100%</div>
      <button class="btn btn-secondary btn-sm" onclick="calZoom(+0.25)" style="font-size:18px;line-height:1;padding:4px 14px">+</button>
      <div style="width:1px;height:20px;background:var(--border2);margin:0 4px"></div>
      <button class="btn btn-secondary btn-sm" onclick="calFit()" style="font-size:11px">Fit</button>
      <button class="btn btn-secondary btn-sm" onclick="calToday()" style="font-size:11px">Today</button>
      <div style="flex:1"></div>
      <div style="font-size:11px;color:var(--text3)">✏️ Pencil ready</div>
    </div>
    <div id="cal-viewport" style="position:relative;width:100%;height:calc(100vh - 212px);overflow:hidden;background:#f9eae1;touch-action:none;cursor:grab">
      <div id="cal-canvas" style="position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform">
        ${svg}
      </div>
    </div>`;

  // ── Interaction ───────────────────────────────────────
  let zoom=1,panX=0,panY=0;
  const vp=document.getElementById('cal-viewport');
  const cv=document.getElementById('cal-canvas');

  function applyView(){
    cv.style.transform=`translate(${panX}px,${panY}px) scale(${zoom})`;
    const lbl=document.getElementById('cal-zoom-label');
    if(lbl)lbl.textContent=Math.round(zoom*100)+'%';
  }

  // Fit calendar width to viewport on load
  const vpW=vp.clientWidth||360;
  zoom=Math.min(1,(vpW-8)/CANVAS_W);
  panX=Math.max(0,(vpW-CANVAS_W*zoom)/2);
  panY=0;
  applyView();

  window.calZoom=d=>{
    const vr=vp.getBoundingClientRect();
    const cx=vr.width/2,cy=vr.height/2;
    const nz=Math.min(4,Math.max(0.2,zoom+d));
    panX=cx-(cx-panX)*(nz/zoom);
    panY=cy-(cy-panY)*(nz/zoom);
    zoom=nz;applyView();
  };
  window.calFit=()=>{
    const vpW2=vp.clientWidth||360;
    zoom=Math.min(1,(vpW2-8)/CANVAS_W);
    panX=Math.max(0,(vpW2-CANVAS_W*zoom)/2);
    panY=0;applyView();
  };
  window.calToday=()=>{
    const mm=monthMeta.find(x=>x.m===tm&&x.y===ty);
    if(!mm)return;
    const vpH=vp.clientHeight||500;
    panY=-(mm.offsetY*zoom)+(vpH/2-100);
    applyView();
  };

  // Jump to today on load
  window.calToday();

  // Mouse wheel zoom
  vp.addEventListener('wheel',e=>{
    e.preventDefault();
    const d=e.deltaY>0?-0.12:0.12;
    const vr=vp.getBoundingClientRect();
    const mx=e.clientX-vr.left,my=e.clientY-vr.top;
    const nz=Math.min(4,Math.max(0.2,zoom+d));
    panX=mx-(mx-panX)*(nz/zoom);
    panY=my-(my-panY)*(nz/zoom);
    zoom=nz;applyView();
  },{passive:false});

  // Mouse drag pan
  let mp=false,mx0=0,my0=0,px0=0,py0=0;
  vp.addEventListener('mousedown',e=>{mp=true;mx0=e.clientX;my0=e.clientY;px0=panX;py0=panY;vp.style.cursor='grabbing';e.preventDefault();});
  document.addEventListener('mousemove',e=>{if(!mp)return;panX=px0+(e.clientX-mx0);panY=py0+(e.clientY-my0);applyView();});
  document.addEventListener('mouseup',()=>{if(mp){mp=false;vp.style.cursor='grab';}});

  // Touch: pinch zoom + pan
  let pinching=false,pd0=0,pz0=1,pmx=0,pmy=0,ppx=0,ppy=0,tmx=0,tmy=0,tpx=0,tpy=0;
  function tDist(e){return Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);}

  vp.addEventListener('touchstart',e=>{
    e.preventDefault();
    if(e.touches.length===2){
      pinching=true;pd0=tDist(e);pz0=zoom;
      const vr=vp.getBoundingClientRect();
      pmx=(e.touches[0].clientX+e.touches[1].clientX)/2-vr.left;
      pmy=(e.touches[0].clientY+e.touches[1].clientY)/2-vr.top;
      ppx=panX;ppy=panY;
    } else if(e.touches.length===1){
      pinching=false;
      tmx=e.touches[0].clientX;tmy=e.touches[0].clientY;tpx=panX;tpy=panY;
    }
  },{passive:false});

  vp.addEventListener('touchmove',e=>{
    e.preventDefault();
    if(e.touches.length===2&&pinching){
      const nz=Math.min(4,Math.max(0.2,pz0*(tDist(e)/pd0)));
      panX=pmx-(pmx-ppx)*(nz/pz0);
      panY=pmy-(pmy-ppy)*(nz/pz0);
      zoom=nz;applyView();
    } else if(e.touches.length===1&&!pinching){
      panX=tpx+(e.touches[0].clientX-tmx);
      panY=tpy+(e.touches[0].clientY-tmy);
      applyView();
    }
  },{passive:false});

  vp.addEventListener('touchend',e=>{if(e.touches.length<2)pinching=false;});
}

function addSchedImages(e){
  if(!S.schedImages)S.schedImages=[];
  const files=Array.from(e.target.files);
  let done=0;
  files.forEach(file=>{
    const reader=new FileReader();
    reader.onload=ev=>{
      const img=new Image();
      img.onload=()=>{
        const canvas=document.createElement('canvas');
        const MAX=1200;
        let w=img.width,h=img.height;
        if(w>MAX){h=Math.round(h*MAX/w);w=MAX}
        canvas.width=w;canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        S.schedImages.push(canvas.toDataURL('image/jpeg',0.85));
        done++;
        if(done===files.length){save();renderPlanningInPlace();}
      };
      img.src=ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function deleteSchedImage(i){
  if(!confirm('Remove this image?'))return;
  S.schedImages.splice(i,1);
  save();renderPlanningInPlace();
}

function initSeatingInteraction(gid){
  const viewport=document.getElementById('seat-viewport');
  const canvas=document.getElementById('seat-canvas');
  if(!viewport||!canvas)return;

  const posKey='tt_seatpos_'+gid;
  let positions=JSON.parse(localStorage.getItem(posKey)||'{}');

  // ── View state ───────────────────────────────────────
  let zoom=1,panX=0,panY=0;
  function applyView(){
    canvas.style.transform=`translate(${panX}px,${panY}px) scale(${zoom})`;
    document.getElementById('seat-zoom-label').textContent=Math.round(zoom*100)+'%';
  }
  applyView();

  window.seatZoom=function(delta){
    zoom=Math.min(2.5,Math.max(0.25,zoom+delta));
    applyView();
  };
  window.seatFitView=function(){
    zoom=1;panX=0;panY=0;applyView();
  };

  // ── Helpers ──────────────────────────────────────────
  function savePos(sid){
    localStorage.setItem(posKey,JSON.stringify(positions));
  }
  function getXY(e){
    if(e.touches&&e.touches.length)return{x:e.touches[0].clientX,y:e.touches[0].clientY};
    return{x:e.clientX,y:e.clientY};
  }
  // Convert viewport coords → canvas coords
  function toCanvas(vx,vy){
    const vr=viewport.getBoundingClientRect();
    return{x:(vx-vr.left-panX)/zoom,y:(vy-vr.top-panY)/zoom};
  }

  // ── Drag state ───────────────────────────────────────
  let dragging=null,dragOffX=0,dragOffY=0,dragMoved=false;
  let longPressTimer=null;

  // ── Rotate state (mouse) ─────────────────────────────
  let rotating=null,rotStartAngle=0,rotInitDeg=0;

  // ── Pinch state ──────────────────────────────────────
  let pinching=false,pinchDist0=0,pinchZoom0=1,pinchMidX=0,pinchMidY=0,pinchPanX0=0,pinchPanY0=0;

  function pinchDist(e){
    const dx=e.touches[0].clientX-e.touches[1].clientX;
    const dy=e.touches[0].clientY-e.touches[1].clientY;
    return Math.hypot(dx,dy);
  }

  // ── Show/hide rotate handles on hover (desktop) ──────
  canvas.querySelectorAll('.seat-card').forEach(card=>{
    const handle=card.querySelector('.seat-rot-handle');
    card.addEventListener('mouseenter',()=>{if(handle)handle.style.opacity='1'});
    card.addEventListener('mouseleave',()=>{if(handle&&!rotating)handle.style.opacity='0'});
  });

  // ── Rotate handle mousedown ──────────────────────────
  canvas.querySelectorAll('.seat-rot-handle').forEach(handle=>{
    handle.addEventListener('mousedown',e=>{
      e.stopPropagation();e.preventDefault();
      const sid=handle.dataset.sid;
      const card=canvas.querySelector(`.seat-card[data-sid="${sid}"]`);
      const cr=card.getBoundingClientRect();
      const cx=cr.left+cr.width/2,cy=cr.top+cr.height/2;
      rotStartAngle=Math.atan2(e.clientY-cy,e.clientX-cx)*(180/Math.PI);
      rotInitDeg=positions[sid]?.rot||0;
      rotating={sid,card,cx,cy};
      handle.style.opacity='1';
      document.addEventListener('mousemove',onRotateMove);
      document.addEventListener('mouseup',onRotateEnd);
    });
  });

  function onRotateMove(e){
    if(!rotating)return;
    const {sid,card,cx,cy}=rotating;
    const angle=Math.atan2(e.clientY-cy,e.clientX-cx)*(180/Math.PI);
    const snap=e.shiftKey?15:1;
    let deg=rotInitDeg+(angle-rotStartAngle);
    deg=Math.round(deg/snap)*snap;
    positions[sid].rot=deg;
    card.style.transform=`rotate(${deg}deg)`;
  }
  function onRotateEnd(){
    if(!rotating)return;
    savePos(rotating.sid);
    document.removeEventListener('mousemove',onRotateMove);
    document.removeEventListener('mouseup',onRotateEnd);
    rotating=null;
  }

  // ── Card pointer events (drag + long-press rotate on touch) ──
  canvas.querySelectorAll('.seat-card').forEach(card=>{
    const sid=card.dataset.sid;

    // MOUSE drag
    card.addEventListener('mousedown',e=>{
      if(e.target.closest('.seat-rot-handle'))return;
      e.preventDefault();
      const cp=toCanvas(e.clientX,e.clientY);
      dragOffX=cp.x-positions[sid].x;
      dragOffY=cp.y-positions[sid].y;
      dragging=card;dragMoved=false;
      card.style.zIndex=100;card.style.cursor='grabbing';
      card.style.boxShadow='0 8px 24px rgba(0,0,0,.5)';
    });

    // TOUCH: long-press = rotate mode, short tap+drag = move
    card.addEventListener('touchstart',e=>{
      if(e.touches.length>1)return; // let pinch handle
      e.preventDefault();
      const t=e.touches[0];
      const cp=toCanvas(t.clientX,t.clientY);
      dragOffX=cp.x-positions[sid].x;
      dragOffY=cp.y-positions[sid].y;
      dragging=card;dragMoved=false;
      card.style.zIndex=100;

      // Long press → enter rotate mode for this card
      longPressTimer=setTimeout(()=>{
        dragging=null;
        // Show a quick visual pulse on the card
        card.style.outline='2px solid var(--blue)';
        // Enter touch-rotate mode
        rotating={sid,card};
        const cr=card.getBoundingClientRect();
        rotating.cx=cr.left+cr.width/2;rotating.cy=cr.top+cr.height/2;
        const t2=e.touches[0];
        rotStartAngle=Math.atan2(t2.clientY-rotating.cy,t2.clientX-rotating.cx)*(180/Math.PI);
        rotInitDeg=positions[sid]?.rot||0;
      },500);
    },{passive:false});
  });

  // ── Global mousemove: drag or pan ────────────────────
  let panDragging=false,panStartX=0,panStartY=0,panX0=0,panY0=0;

  viewport.addEventListener('mousedown',e=>{
    if(e.target.closest('.seat-card')||e.target.closest('.seat-rot-handle'))return;
    panDragging=true;panStartX=e.clientX;panStartY=e.clientY;panX0=panX;panY0=panY;
    viewport.style.cursor='grabbing';
  });

  document.addEventListener('mousemove',e=>{
    if(dragging){
      const cp=toCanvas(e.clientX,e.clientY);
      const nx=cp.x-dragOffX,ny=cp.y-dragOffY;
      positions[dragging.dataset.sid].x=nx;positions[dragging.dataset.sid].y=ny;
      dragging.style.left=nx+'px';dragging.style.top=ny+'px';
      dragMoved=true;
    } else if(panDragging){
      panX=panX0+(e.clientX-panStartX);panY=panY0+(e.clientY-panStartY);
      applyView();
    }
  });

  document.addEventListener('mouseup',e=>{
    if(dragging){
      dragging.style.zIndex=1;dragging.style.cursor='grab';
      dragging.style.boxShadow='';
      if(dragMoved)savePos(dragging.dataset.sid);
      dragging=null;
    }
    if(panDragging){panDragging=false;viewport.style.cursor='';}
  });

  // ── Mouse wheel zoom ─────────────────────────────────
  viewport.addEventListener('wheel',e=>{
    e.preventDefault();
    const delta=e.deltaY>0?-0.08:0.08;
    // Zoom toward cursor
    const vr=viewport.getBoundingClientRect();
    const mx=e.clientX-vr.left,my=e.clientY-vr.top;
    const newZoom=Math.min(2.5,Math.max(0.25,zoom+delta));
    panX=mx-(mx-panX)*(newZoom/zoom);
    panY=my-(my-panY)*(newZoom/zoom);
    zoom=newZoom;applyView();
  },{passive:false});

  // ── Touch events: pinch zoom + card drag/rotate ───────
  viewport.addEventListener('touchmove',e=>{
    if(e.touches.length===2){
      e.preventDefault();
      if(!pinching){
        pinching=true;pinchDist0=pinchDist(e);pinchZoom0=zoom;
        pinchMidX=(e.touches[0].clientX+e.touches[1].clientX)/2;
        pinchMidY=(e.touches[0].clientY+e.touches[1].clientY)/2;
        pinchPanX0=panX;pinchPanY0=panY;
        dragging=null;clearTimeout(longPressTimer);
      }
      const newZoom=Math.min(2.5,Math.max(0.25,pinchZoom0*(pinchDist(e)/pinchDist0)));
      const vr=viewport.getBoundingClientRect();
      const mx=pinchMidX-vr.left,my=pinchMidY-vr.top;
      panX=mx-(mx-pinchPanX0)*(newZoom/pinchZoom0);
      panY=my-(my-pinchPanY0)*(newZoom/pinchZoom0);
      zoom=newZoom;applyView();
      return;
    }
    if(rotating&&e.touches.length===1){
      e.preventDefault();
      const t=e.touches[0];
      const angle=Math.atan2(t.clientY-rotating.cy,t.clientX-rotating.cx)*(180/Math.PI);
      let deg=rotInitDeg+(angle-rotStartAngle);
      deg=Math.round(deg);
      positions[rotating.sid].rot=deg;
      rotating.card.style.transform=`rotate(${deg}deg)`;
      return;
    }
    if(dragging&&e.touches.length===1){
      e.preventDefault();
      clearTimeout(longPressTimer);
      const t=e.touches[0];
      const cp=toCanvas(t.clientX,t.clientY);
      const nx=cp.x-dragOffX,ny=cp.y-dragOffY;
      positions[dragging.dataset.sid].x=nx;positions[dragging.dataset.sid].y=ny;
      dragging.style.left=nx+'px';dragging.style.top=ny+'px';
      dragMoved=true;
    }
  },{passive:false});

  viewport.addEventListener('touchend',e=>{
    clearTimeout(longPressTimer);
    if(pinching){pinching=false;return;}
    if(rotating){
      rotating.card.style.outline='';
      savePos(rotating.sid);rotating=null;return;
    }
    if(dragging){
      dragging.style.zIndex=1;dragging.style.boxShadow='';
      if(dragMoved)savePos(dragging.dataset.sid);
      dragging=null;
    }
  });
}

function resetSeats(gid){
  if(!confirm('Reset all positions and rotations to default grid?'))return;
  localStorage.removeItem('tt_seatpos_'+gid);
  S.section='seating-plan';
  render();
}

function exportSeatPNG(gid){
  const g=S.groups.find(x=>x.id===gid);
  const students=groupStudents(gid);
  const posKey='tt_seatpos_'+gid;
  const positions=JSON.parse(localStorage.getItem(posKey)||'{}');
  const col=g?getColor(g.color):COLORS[0];
  const dotColor=col.dot;
  const CARD_W=80,CARD_H=96,PAD=40,COLS=4;

  // Initialize missing positions
  students.forEach((s,i)=>{
    if(!positions[s.id]){
      const c2=i%COLS,row=Math.floor(i/COLS);
      positions[s.id]={x:PAD+c2*(CARD_W+12),y:PAD+row*(CARD_H+12),rot:0};
    }
    if(positions[s.id].rot===undefined)positions[s.id].rot=0;
  });

  // Bounding box
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  students.forEach(s=>{
    const p=positions[s.id];
    const diag=Math.hypot(CARD_W,CARD_H)/2;
    minX=Math.min(minX,p.x-diag);minY=Math.min(minY,p.y-diag);
    maxX=Math.max(maxX,p.x+CARD_W+diag);maxY=Math.max(maxY,p.y+CARD_H+diag);
  });

  const offsetX=-minX+PAD,offsetY=-minY+PAD+24;
  const cw=Math.max(maxX-minX+PAD*2,400),ch=Math.max(maxY-minY+PAD*2+24,300);
  const scale=2;
  const canvas=document.createElement('canvas');
  canvas.width=cw*scale;canvas.height=ch*scale;
  const ctx=canvas.getContext('2d');
  ctx.scale(scale,scale);

  // Background + dot grid
  ctx.fillStyle='#f9eae1';ctx.fillRect(0,0,cw,ch);
  ctx.fillStyle='#e0c8be';
  for(let gx=0;gx<cw;gx+=32)for(let gy=0;gy<ch;gy+=32)ctx.fillRect(gx,gy,1.5,1.5);

  // Title
  ctx.fillStyle='#5c3d3d';ctx.font='bold 13px sans-serif';ctx.textAlign='left';ctx.textBaseline='top';
  ctx.fillText(g?g.name:'Seating Plan',12,8);

  // Pre-load all photos first, then draw everything synchronously
  const photoMap={};
  const photoStudents=students.filter(s=>s.photo);
  let loaded=0;

  function drawAll(){
    students.forEach(s=>{
      const p=positions[s.id];
      const cx=p.x+offsetX+CARD_W/2,cy=p.y+offsetY+CARD_H/2;
      const rad=(p.rot||0)*Math.PI/180;

      ctx.save();
      ctx.translate(cx,cy);ctx.rotate(rad);

      // Card
      ctx.fillStyle='#fff8f4';
      ctx.beginPath();ctx.roundRect(-CARD_W/2,-CARD_H/2,CARD_W,CARD_H,10);ctx.fill();
      ctx.strokeStyle='#cdb0a6';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.roundRect(-CARD_W/2,-CARD_H/2,CARD_W,CARD_H,10);ctx.stroke();

      // Avatar bg + ring
      const avy=-CARD_H/2+14+26;
      ctx.fillStyle='#f0e0d6';
      ctx.beginPath();ctx.arc(0,avy,26,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle=dotColor;ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(0,avy,26,0,Math.PI*2);ctx.stroke();

      // Photo or initials
      const img=photoMap[s.id];
      if(img){
        ctx.save();ctx.beginPath();ctx.arc(0,avy,24,0,Math.PI*2);ctx.clip();
        ctx.drawImage(img,-24,avy-24,48,48);ctx.restore();
      } else {
        ctx.fillStyle=dotColor;ctx.font='bold 15px sans-serif';
        ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText(initials(s.name),0,avy);
      }

      // Name
      const first=s.name.split(' ')[0];
      const last=s.name.split(' ').slice(1).join(' ');
      ctx.fillStyle='#5c3d3d';ctx.font='bold 9px sans-serif';ctx.textAlign='center';ctx.textBaseline='top';
      ctx.fillText(first,0,CARD_H/2-32);
      ctx.fillStyle='#9a7070';ctx.font='8px sans-serif';
      ctx.fillText(last,0,CARD_H/2-20);

      ctx.restore();
    });

    // Trigger download
    const link=document.createElement('a');
    link.download=(g?g.name.replace(/\s+/g,'-'):'seating')+'-plan.png';
    link.href=canvas.toDataURL('image/png');
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  if(photoStudents.length===0){
    drawAll();
  } else {
    photoStudents.forEach(s=>{
      const img=new Image();
      img.onload=()=>{photoMap[s.id]=img;loaded++;if(loaded===photoStudents.length)drawAll();};
      img.onerror=()=>{loaded++;if(loaded===photoStudents.length)drawAll();};
      img.src=s.photo;
    });
  }
}

function renderAllStudents(){
  const area=document.getElementById('students-list-area');if(!area)return;

// ── DATA MANAGEMENT ──────────────────────────────────────
function exportData(){
  const keys=['tt_groups','tt_students','tt_attendance','tt_participation','tt_behavior','tt_btags','tt_todos','tt_grades','tt_gassign','tt_rubric','tt_terms','tt_checklist','tt_assignments','tt_contacts','tt_schedule','tt_schedblocks','tt_journal','tt_iepstrats','tt_schedimgs','tt_snotes','tt_subnotes'];
  const data={version:1,exported:new Date().toISOString(),data:{}};
  keys.forEach(k=>{const v=localStorage.getItem(k);if(v)data.data[k]=v});
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const date=new Date().toISOString().slice(0,10);
  a.href=url;a.download=`teacher-tracker-backup-${date}.json`;
  a.click();URL.revokeObjectURL(url);
  showToast('✓ Backup downloaded');
}

function importData(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const parsed=JSON.parse(ev.target.result);
      const entries=parsed.data||parsed; // support both wrapped and raw
      if(typeof entries!=='object')throw new Error('Invalid format');
      Object.entries(entries).forEach(([k,v])=>{
        if(k.startsWith('tt_'))localStorage.setItem(k,v);
      });
      showToast('✓ Data restored — reloading...');
      setTimeout(()=>location.reload(),1200);
    }catch(err){
      showToast('✗ Invalid backup file');
    }
  };
  reader.readAsText(file);
  e.target.value=''; // reset so same file can be re-imported
}

  } else if(sh.type==='rubric'){

function openAddTodo(){S.sheet={type:'add-todo',title:'',due:'',groupId:''};renderSheet()}
function logBehaviour(sid,gid,tid){const tag=S.behaviorTags.find(t=>t.id===tid);if(!tag)return;S.behavior.push({id:'b'+Date.now(),sid,gid,tid,label:tag.label,type:tag.type,date:todayStr(),ts:Date.now()});save();closeSheet()}
function openBehTagEditor(){S.sheet={type:'beh-tags',newLabel:'',newType:'pos'};renderSheet()}
function saveBehTag(){const sh=S.sheet;if(!sh.newLabel.trim()){alert('Please enter a tag name');return}S.behaviorTags.push({id:'bt'+Date.now(),label:sh.newLabel.trim(),type:sh.newType});save();S.sheet={type:'beh-tags',newLabel:'',newType:'pos'};renderSheet()}
function deleteBehTag(id){if(!confirm('Delete this tag?'))return;S.behaviorTags=S.behaviorTags.filter(t=>t.id!==id);save();S.sheet={type:'beh-tags',newLabel:'',newType:'pos'};renderSheet()}
function triggerPhotoUpload(){document.getElementById('photo-input')?.click()}
function handlePhotoUpload(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=ev=>{const img=new Image();img.onload=()=>{const canvas=document.createElement('canvas');const MAX=200;let w=img.width,h=img.height;if(w>h){if(w>MAX){h=h*(MAX/w);w=MAX}}else{if(h>MAX){w=w*(MAX/h);h=MAX}}canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(img,0,0,w,h);S.sheet.photo=canvas.toDataURL('image/jpeg',0.75);renderSheet()};img.src=ev.target.result};reader.readAsDataURL(file)}
function saveAddGroup(){const sh=S.sheet;if(!sh.name.trim()){alert('Please enter a group name');return}S.groups.push({id:'g'+Date.now(),name:sh.name.trim(),color:sh.color});save();closeSheet()}
function saveEditGroup(id){const sh=S.sheet;if(!sh.name.trim()){alert('Enter a name');return}const g=S.groups.find(x=>x.id===id);if(g){g.name=sh.name.trim();g.color=sh.color}save();closeSheet()}
function deleteGroup(id){if(!confirm('Delete this group? Students will also be removed.'))return;S.groups=S.groups.filter(g=>g.id!==id);S.students=S.students.filter(s=>s.groupId!==id);save();S.section='classes';closeSheet()}
function saveAddStudent(addAnother){const sh=S.sheet;if(!sh.name.trim()){alert('Enter a name');return}const num=sh.num.trim()||String(nextStudentNum(sh.groupId));S.students.push({id:'s'+Date.now(),groupId:sh.groupId,name:sh.name.trim(),num,birthday:sh.birthday,photo:sh.photo,iep:sh.iep,codes:sh.codes});save();if(addAnother){openAddStudent(sh.groupId)}else{closeSheet()}}
function saveEditStudent(id){const sh=S.sheet;if(!sh.name.trim()){alert('Enter a name');return}const s=S.students.find(x=>x.id===id);if(s){s.name=sh.name.trim();s.num=sh.num.trim();s.birthday=sh.birthday;s.photo=sh.photo;s.iep=sh.iep;s.codes=sh.codes}save();closeSheet()}
function deleteStudent(id){if(!confirm('Remove this student?'))return;S.students=S.students.filter(s=>s.id!==id);save();S.section='group-detail';closeSheet()}
function saveAddTodo(){const sh=S.sheet;if(!sh.title.trim()){alert('Enter a task title');return}S.todos.push({id:'td'+Date.now(),title:sh.title.trim(),due:sh.due,groupId:sh.groupId,done:false});save();closeSheet()}
function comingSoon(name){document.getElementById('sheet-overlay')?.remove();const div=document.createElement('div');div.id='sheet-overlay';div.className='sheet-overlay';div.onclick=e=>{if(e.target===div)div.remove()};div.innerHTML=`<div class="sheet"><div class="sheet-handle"></div><div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 24px;gap:16px;text-align:center"><div style="font-size:18px;font-weight:600">${name}</div><div style="font-size:13px;color:var(--text3);max-width:240px">Coming soon.</div><button class="btn btn-primary btn-sm" onclick="document.getElementById('sheet-overlay')?.remove()">Got it</button></div></div>`;document.body.appendChild(div)}

  {section:'Auditory',items:['Preview material orally (teacher)','Oral rehearsal prior to assignment','Repeat or confirm directions / instructions','Phone home to record homework on answering machine','Verbal triple rehearse (improve retention by repeating aloud)','Use of headphones when doing independent work','Break down instructions to manageable chunks','Read books on CD/ipod','Use mnemonics to improve recall of information','Access prior knowledge at beginning of a lesson or discussion','Listen to instrumental music at low volume during work periods','Record homework on a device','Record instructions on a device']},
  {section:'Tactile/Kinesthetic',items:['Use movement opportunities to improve ability to focus','Relocate contents of desk to encourage movement','Use individual work files or baskets with tactile activities','Use manipulatives','Review content through hands-on games (ex. fortune tellers, board games, cards, etc.)','Use paper clip to move along edge of page for focus and following','Use sticky notes to capture key ideas on texts','Build symbolic representation of content with Lego or other materials','Use sticky labels for spelling','Use a keyboard','Volunteer for classroom job requiring movement (distribution of materials, sharpening pencils, returning library books...)','Use an alternative to seat work (use of a standing work station, etc.)','Use magnets & magnetic surface (cookie sheet, filing cabinet, etc)','Use seat cushion/hula hoop/masking tape to define space during circle time','Use inflatable seat cushion to help increase seat time','Use pipe cleaners, Wikki Stix or play dough to form shapes, letters, numbers, etc.','Use a variety of sizes and textures for writing materials','Use props related to content for student to hold','Use velcro boards (velcro on carpet squares)','Use sticky labels with information pre-printed on labels (peel-off)','Use tactile tools (manipulatives, models, computer, IPad)','Use kinesthetic tools (brain breaks, movement breaks)','The use of flexible seating']},
  {section:'Social Skills',items:['Wait until the person has answered your question before ending the conversation','Stand or sit at least an arms length away from a person so as not to invade their space','Make eye contact, keep hands and feet still, and have a quiet mouth to be a good listener','Walk up to the person, wait for a pause in conversation and say "Excuse me..." when interrupting is necessary','Say, "Hi" the first time you see someone','Say, "See you later" when someone is leaving, or at the end of the day','Wait for a pause in the conversation before asking a question about what the other person is saying','Ask follow-up questions using WHO, WHAT, WERE, WHY and HOW to maintain a conversation','Say, "My name is ____. What\'s your name?" when introducing yourself to someone you don\'t know','Notice signs that indicate if the other person is interested in or bored with your topic during a conversation','Walk up to a friend, wait for them to look at you, then ask "Do you want to play?"','Do some of what your friend wants to do and then some of what you want to do when compromising','Think to yourself, "If I wait, then I will get a turn," when playing a game','Ask how to play the game, decide who will go first, and take turns when playing a game','Think to yourself, "It\'s only a game. There will be other games," when losing during a game','Say, "Good game," after winning or losing a game','Stop and count to ten in order to calm yourself','Take 3 deep breaths in order to calm yourself','Do something fun to feel better in order to calm yourself','Tell someone how you feel in order to calm yourself','Look for signs (facial expression, body language) that other people are sad, angry or need help to show understanding for others\' feelings','Ask, "Are you okay? Can I help?" if you notice someone is in trouble','Accept "No" by saying "Okay"','When there is something new, talk about it, calm yourself, watch others, ask for an explanation, try it','Tell the person teasing you, "Stop" in a strong voice, ignore, walk away, then tell an adult','Try, ask for help, ask for a short break, try again when work is hard']}
];

// ── IEP TRACKER ─────────────────────────────────────────
function renderIEPList(c){
  const iepStudents=S.students.filter(s=>s.iep);
  c.innerHTML=`<div class="page-header">
    <div style="display:flex;align-items:center;gap:10px">
      <button class="btn-icon" onclick="S.section='students';render()"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>
      <div class="page-title">IEP Tracker</div>
    </div>
  </div>
  ${iepStudents.length===0
    ?`<div class="empty"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg><div class="empty-title">No IEP students</div><div class="empty-sub">Mark students as having an IEP in their profile under Setup.</div></div>`
    :`<div class="card" style="margin-top:12px">${iepStudents.map(s=>{
        const g=S.groups.find(x=>x.id===s.groupId);
        const col=g?getColor(g.color):COLORS[0];
        const stratCount=(S.iepStrategies[s.id]||[]).length;
        return`<div class="student-row" onclick="S.iepStudent='${s.id}';S.section='iep-detail';render()">
          <div class="avatar" style="width:44px;height:44px;font-size:15px">${s.photo?`<img src="${s.photo}">`:`<span>${initials(s.name)}</span>`}</div>
          <div class="student-info">
            <div class="student-name" style="display:flex;align-items:center;gap:8px">${s.name}${s.codes?`<span style="font-size:11px;color:var(--text3)">${s.codes}</span>`:''}${s.iep?`<span class="tag" style="background:var(--amber-bg);color:var(--amber)">IEP</span>`:''}</div>
            <div class="student-meta">${g?`<span class="group-badge ${col.cls}">${g.name}</span> · `:''} ${stratCount} strateg${stratCount!==1?'ies':'y'}</div>
          </div>
          <div class="chevron"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></div>
        </div>`;
      }).join('')}</div>`}`;
}

function renderIEPDetail(c){
  const s=S.students.find(x=>x.id===S.iepStudent);
  if(!s){S.section='iep-list';render();return}
  const g=S.groups.find(x=>x.id===s.groupId);
  const col=g?getColor(g.color):COLORS[0];
  const selected=S.iepStrategies[s.id]||[];

  // Group selected strategies by section for display
  const bySection=IEP_STRATEGIES.map(sec=>({
    section:sec.section,
    items:sec.items.filter(item=>selected.includes(item))
  })).filter(sec=>sec.items.length>0);

  c.innerHTML=`<div class="page-header">
    <div style="display:flex;align-items:center;gap:10px">
      <button class="btn-icon" onclick="S.section='iep-list';render()"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>
      <div>
        <div class="page-title" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          ${s.name}${s.codes?`<span style="font-size:12px;font-weight:400;color:var(--text3)">${s.codes}</span>`:''}
          <span class="tag" style="background:var(--amber-bg);color:var(--amber);font-size:11px">IEP</span>
        </div>
        ${g?`<div style="font-size:12px;color:var(--text3);margin-top:2px"><span class="group-badge ${col.cls}">${g.name}</span></div>`:''}
      </div>
    </div>
    <button class="btn btn-sm btn-secondary" onclick="exportIEPPDF('${s.id}')">Copy to Clipboard</button>
  </div>

  <div style="padding:12px 16px;display:flex;align-items:center;justify-content:space-between">
    <div class="section-label" style="padding:0">Strategies</div>
    <button class="btn btn-sm btn-${selected.length?'secondary':'primary'}" onclick="openStrategySheet('${s.id}')">${selected.length?'Edit Strategies':'+ Add Strategies'}</button>
  </div>

  ${selected.length===0
    ?`<div style="padding:24px 16px;text-align:center;font-size:13px;color:var(--text3)">No strategies selected yet. Tap "+ Add Strategies" to get started.</div>`
    :`<div class="card" style="margin-bottom:16px" id="iep-strat-list">
        ${bySection.map(sec=>`
          <div style="padding:10px 16px 4px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);border-bottom:1px solid var(--border)">${sec.section}</div>
          ${sec.items.map(item=>`<div style="padding:10px 16px;border-bottom:1px solid var(--border);font-size:13px;color:var(--text);line-height:1.4">${item}</div>`).join('')}
        `).join('')}
      </div>`}

  <div style="padding:12px 16px;display:flex;align-items:center;justify-content:space-between">
    <div class="section-label" style="padding:0">Goals</div>
    <span style="font-size:12px;color:var(--text3)">Coming next year</span>
  </div>`;
}

function openStrategySheet(sid){
  const selected=[...(S.iepStrategies[sid]||[])];
  S.sheet={type:'iep-strategies',sid,selected};
  renderSheet();
}

function saveIEPStrategies(){
  const sh=S.sheet;
  S.iepStrategies[sh.sid]=sh.selected;
  save();
  closeSheet();
  render();
}

function toggleIEPStrat(si,ii){
  const item=IEP_STRATEGIES[si].items[ii];
  const sel=S.sheet.selected;
  const idx=sel.indexOf(item);
  if(idx>-1)sel.splice(idx,1);else sel.push(item);
  // Patch DOM without re-rendering (preserves scroll)
  const checked=sel.includes(item);
  const rows=document.querySelectorAll('#strat-scroll-body [onclick]');
  // Find matching row by si/ii via onclick attr
  const row=Array.from(rows).find(r=>r.getAttribute('onclick')===`toggleIEPStrat(${si},${ii})`);
  if(row){
    row.style.background=checked?'var(--blue-bg)':'transparent';
    const box=row.querySelector('div');
    box.style.border=`2px solid ${checked?'var(--blue)':'var(--border2)'}`;
    box.style.background=checked?'var(--blue)':'var(--bg3)';
    box.innerHTML=checked?`<svg viewBox="0 0 24 24" style="width:12px;height:12px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round"><polyline points="20 6 9 17 4 12"/></svg>`:'';
    const label=row.querySelectorAll('div')[1];
    if(label)label.style.color=checked?'var(--text)':'var(--text2)';
  }
  // Update count in header
  const hdr=document.querySelector('.sheet-header span:last-child');
  if(hdr)hdr.textContent=sel.length+' selected';
}

function showToast(msg){
  let t=document.getElementById('_toast');
  if(!t){t=document.createElement('div');t.id='_toast';t.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#7d4f50;color:#f9eae1;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;z-index:9999;pointer-events:none;transition:opacity .3s';document.body.appendChild(t);}
  t.textContent=msg;t.style.opacity='1';
  clearTimeout(t._timer);t._timer=setTimeout(()=>t.style.opacity='0',2500);
}

function exportIEPPDF(sid){
  const s=S.students.find(x=>x.id===sid);
  if(!s)return;
  const g=S.groups.find(x=>x.id===s.groupId);
  const selected=S.iepStrategies[sid]||[];
  const bySection=IEP_STRATEGIES.map(sec=>({
    section:sec.section,
    items:sec.items.filter(item=>selected.includes(item))
  })).filter(sec=>sec.items.length>0);
  if(!bySection.length){showToast('No strategies selected.');return}

  const plain=`${s.name}${s.codes?' ('+s.codes+')':''}\nIEP Strategies${g?' · '+g.name:''}\n\n`
    +bySection.map(sec=>sec.section.toUpperCase()+'\n'+sec.items.map(i=>'• '+i).join('\n')).join('\n\n');

  navigator.clipboard.writeText(plain).then(()=>showToast('✓ Copied to clipboard!')).catch(()=>{
    // Final fallback: textarea select
    const ta=document.createElement('textarea');
    ta.value=plain;ta.style.cssText='position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta);ta.focus();ta.select();
    document.execCommand('copy');ta.remove();showToast('✓ Copied to clipboard!');
  });
}
render();
</script>
